  <path d="M336 184 C336 152, 308 136, 256 136 C200 136, 172 160, 172 196 C172 232, 196 248, 252 264 C304 280, 340 296, 340 340 C340 384, 300 416, 248 416 C188 416, 156 384, 152 336 L212 336 C216 358, 230 370, 252 370 C274 370, 290 358, 290 340 C290 320, 274 308, 226 294 C174 278, 128 258, 128 200 C128 152, 170 112, 252 112 C330 112, 384 148, 384 204 Z" fill="#ffffff" opacity="0.96"/>

