<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spidey Jersey - Authentic Sports Jersey Store</title>
    <meta name="description" content="Futuristic high-end sports jersey showcase with floating glassmorphism UI, interactive product zoom gallery, and dynamic order management." />
    <meta property="og:title" content="Spidey Jersey - Authentic Sports Jersey Store" />
    <meta property="og:description" content="Futuristic high-end sports jersey showcase with floating glassmorphism UI, interactive product zoom gallery, and dynamic order management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" id="app-manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e50914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="apple-app-title" content="Spidey Admin" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var s = window.location.search.toLowerCase();
          var isPlaceOrder = p === '/placeorder' || p.startsWith('/placeorder') || s.includes('placeorder');
          var manifestEl = document.getElementById('app-manifest');
          var appleTitle = document.getElementById('apple-app-title');
          if (isPlaceOrder) {
            if (manifestEl) manifestEl.href = '/manifest-placeorder.json';
            if (appleTitle) appleTitle.content = 'Spidey Place Order';
            document.title = 'Spidey Place Order';
          } else {
            if (manifestEl) manifestEl.href = '/manifest-admin.json';
            if (appleTitle) appleTitle.content = 'Spidey Admin';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
